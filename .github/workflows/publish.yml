# Manual release to npm. Run it from the Actions tab: it checks, builds the wasm
# plugin and the Vite plugin, waits for a reviewer of the `npm` environment to
# approve, publishes the three workspace packages in lockstep and pushes a
# v<version> tag:
#   @memebattle/build-conditions       (packages/core)
#   @memebattle/build-conditions-swc   (packages/swc)
#   @memebattle/build-conditions-vite  (packages/vite)
#
# Auth: trusted publishing only (OIDC, no secret), bound per package to this
# workflow and the `npm` environment. Trusted publishing can be bound only to a
# package that already exists on npm, so a maintainer publishes the first
# version of a new package name once by hand, from the packed tarball, then
# binds the name:
#   npm trust github <name> --repo MemeBattle/build-conditions --file publish.yml --environment npm --allow-publish
# and runs this workflow for the same version, which publishes the rest.
#
# Resuming: the Publish step skips a package whose name@version is already on
# npm, so rerunning a release that failed halfway publishes only what is left
# and then pushes the tag. The version guard fails only when the v<version>
# tag exists, and warns about packages that are already published.
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm dist-tag
        type: choice
        options: [latest, next]
        default: latest
      dry-run:
        description: Run every step except the publish and the tag push
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers on the environment gate the job; the trusted publisher
    # on npm is bound to this environment too, so a run outside it cannot publish.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@memebattle/build-conditions
    permissions:
      contents: write # push the release tag and create the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - name: Refuse a `latest` release from a non-default branch
        if: inputs.dist-tag == 'latest' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::The latest tag is published from main only (got ${GITHUB_REF})"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # needed for the tag push below

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # the pnpm version comes from the packageManager field of package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/swc

      - name: Print tool versions
        run: |
          node --version
          npm --version
          pnpm --version
          cargo --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm run fmt:check
      - run: pnpm run typecheck
      - run: pnpm run unit
      - run: pnpm run unit:swc-plugin
      - run: pnpm run build

      - name: Read the version and make sure it is not released yet
        id: version
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        # All packages share one version. The release is finished once its tag
        # exists, so only the tag fails the run; packages already on npm are a
        # resumed release (or a first version published by hand) and only
        # warn. A dry run only reports an existing tag, so the pipeline can be
        # exercised between releases; differing versions fail even then.
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          names=""
          for dir in core swc vite; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            own=$(node -p "require('./packages/$dir/package.json').version")
            if [ "$own" != "$version" ]; then
              echo "::error::$name is at $own, packages/core is at $version; all packages are released in lockstep"
              exit 1
            fi
            names="$names $name"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "names=${names# }" >> "$GITHUB_OUTPUT"
          level=error
          if [ "$DRY_RUN" = "true" ]; then level=warning; fi
          taken=0
          # ls-remote, not rev-parse: the checkout is shallow and has no tags
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::$level::Tag v$version already exists; bump the version in packages/*/package.json"
            taken=1
          fi
          published=""
          for name in $names; do
            if npm view "$name@$version" version >/dev/null 2>&1; then
              published="$published $name"
            fi
          done
          if [ -n "$published" ]; then
            echo "::warning::Already published at $version, the Publish step skips them:$published"
          fi
          if [ "$taken" = 1 ] && [ "$DRY_RUN" != "true" ]; then
            exit 1
          fi

      # pnpm pack rewrites workspace: ranges and runs prepack; the inspected
      # tarballs are the ones published below
      - name: Pack and inspect the tarballs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for dir in core swc vite; do
            (cd "packages/$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
          node .github/scripts/check-tarballs.mjs "$VERSION" "$RUNNER_TEMP"/tarballs/*.tgz

      # Skips a package already on npm at this version, so a rerun of a
      # release that failed halfway resumes it
      - name: Publish
        if: ${{ !inputs.dry-run }}
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
          VERSION: ${{ steps.version.outputs.version }}
          NAMES: ${{ steps.version.outputs.names }}
        run: |
          for name in $NAMES; do
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::$name@$VERSION is already on npm, skipping it"
              continue
            fi
            # pnpm pack names @scope/name as scope-name-<version>.tgz
            tarball="$RUNNER_TEMP/tarballs/$(echo "${name#@}" | tr / -)-$VERSION.tgz"
            npm publish "$tarball" --provenance --access public --tag "$DIST_TAG"
          done

      - name: Tag the release
        if: ${{ !inputs.dry-run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Create the GitHub release
        if: ${{ !inputs.dry-run && inputs.dist-tag == 'latest' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag
